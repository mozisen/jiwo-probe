name: Sync upstream

on:
  schedule:
    # 每天北京时间 11:23 检查更新，避开整点的 Actions 高峰。
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # 官方仓库自身不跑；下游仓库跑。upstream 指向定制源(chnnic/jiwo-probe)。
    # 纯 shell git 实现, 不依赖任何 action(避开 actions/checkout 在 Node24 runner 上的兼容问题)。
    if: github.repository != 'chnnic/jiwo-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Check out user repository
        run: |
          git clone --branch "${GITHUB_REF_NAME}" --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream updates
        id: merge
        run: |
          cd repo
          git remote add upstream "https://github.com/chnnic/jiwo-probe.git"
          git fetch --no-tags upstream main:refs/remotes/upstream/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi

          git merge --no-edit "upstream/main" || {
            echo "::error::与本地改动冲突, 请手动处理以下文件:"
            git diff --name-only --diff-filter=U
            exit 1
          }
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Push upstream updates
        if: steps.merge.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          cd repo
          : "${GITHUB_TOKEN:?GitHub Actions token is missing}"
          # Keep the credential out of the remote URL and Git configuration.
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GITHUB_TOKEN"; fi; }; f' \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
